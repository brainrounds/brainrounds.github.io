<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- user-scalable=no stops a double-tap or pinch from zooming the board
         mid-game; the app is already laid out large for its audience. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2d7d6f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="A brain-training session that runs itself: pick the games once, press start, and the whole queue plays through without anyone driving it."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Brain Rounds</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Brain Rounds needs JavaScript switched on.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
